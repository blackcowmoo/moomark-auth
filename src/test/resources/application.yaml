spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:8080/api/v1/oauth2/google
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

passport:
  public-key: ${RSA_PUBLIC_KEY:MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0sZT}
  private-key: ${RSA_PRIVATE_KEY:MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC0Z3VS5JJcds3xfn/ygWyF8PbnGy0sZT}
  test:
    token:
      expired:
        user: test@example.com
        key: test-key

resources:
  user:
    default-picture: https://avatars.githubusercontent.com/u/60027496?v=4
